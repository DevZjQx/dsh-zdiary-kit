name: release

# 打 tag 即发布：git tag v0.6.1 && git push origin v0.6.1
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # 必需：trusted publishing 用它换 npm 的短期发布凭证（顺带签名 provenance）

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ZK_VERSION: 0.15.7
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # trusted publishing 要求 npm >= 11.5.1 / node >= 22.14；node 24 自带 npm 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # 与 ci.yml 同源：集成测试要真起 zk，没有 zk 时 scripts/test.ts 会把「全部跳过」按失败处理
      - name: 装 zk
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          url="https://github.com/zk-org/zk/releases/download/v${ZK_VERSION}/zk-v${ZK_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "$url" -o "$RUNNER_TEMP/zk.tar.gz"
          tar -xzf "$RUNNER_TEMP/zk.tar.gz" -C "$RUNNER_TEMP/bin" zk
          chmod +x "$RUNNER_TEMP/bin/zk"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/zk" --version

      - run: bun install --frozen-lockfile

      # tag 与 package.json 版本必须一致，否则会发错版本号且无法撤销
      - name: 校验 tag 与版本
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          [ "$tag" = "$pkg" ] || { echo "tag ${GITHUB_REF_NAME} 与 package.json ${pkg} 不一致"; exit 1; }

      # 发布闸门：typecheck → build → dist 漂移 → test → smoke（真加载 dist 跑工具与设置路由）
      - run: bun run check
      - run: bun run smoke

      # 无 token：npm 用 id-token 换 OIDC 凭证，provenance 自动生成，无需 --provenance
      # 前置：npmjs 包设置里配了 Trusted Publisher（仓库 DevZjQx/dsh-zdiary-kit + 本文件名）
      # 闸门已显式跑过，--ignore-scripts 避免 prepublishOnly 再执行一遍 check
      - run: npm publish --ignore-scripts
