# ============================================================================
# dsh-zdiary-kit —— DSH bundle patch
# ============================================================================
# 插件挂载声明：DSH 启动时把本插件插进 profile 的配置树。
#
# 安装（本地目录）：
#   dsh plugin --profile desktop add "link:/path/to/dsh-zdiary-kit"
# 或发布后：
#   dsh plugin --profile desktop add dsh-zdiary-kit
#
# ⚠️ `name:` 必须与安装后的包名完全一致（这里是 dsh-zdiary-kit），
#    否则表现为「装上了但设置页 404」。
# 设置页在：DSH「设置 → 知识库（zk）」（dist/features/settings/client.js 注册的 section）。
# ============================================================================

- insert:
    - id: dsh-zdiary-kit
      name: dsh-zdiary-kit
